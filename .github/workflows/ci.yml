name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Source audit and tests (no robot, no ROS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Check shell script syntax
        run: |
          for f in *.sh deployment/*.sh; do
            bash -n "$f"
          done

      - name: Permissive source audit
        run: ./deployment/audit_permissive_source.sh .

      - name: Run tests
        run: |
          python -m pytest -q tests \
            SCAN-Planner-ros2-community/src/planner/plan_manage/test/test_limx_websocket_cmd_bridge.py \
            SCAN-Planner-ros2-community/src/planner/plan_manage/test/test_chassis_configuration.py
